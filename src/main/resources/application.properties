spring.application.name=Temporal
app.mode=${APP_MODE:api}
app.allow-crash=${APP_ALLOW_CRASH:false}
app.auth.issuer-uri=${AUTH_ISSUER_URI:}
app.auth.audience=${AUTH_AUDIENCE:}
temporal.target=${TEMPORAL_TARGET:}
temporal.namespace=${TEMPORAL_NAMESPACE:}
temporal.task-queue=${WORKFLOW_TASK_QUEUE:user-demo-queue}
temporal.tls.enabled=${TEMPORAL_TLS_ENABLED:false}
temporal.tls.cert-file=${TEMPORAL_TLS_CERT_FILE:}
temporal.tls.key-file=${TEMPORAL_TLS_KEY_FILE:}
temporal.tls.ca-file=${TEMPORAL_TLS_CA_FILE:}
worker.control.base-url=${WORKER_CONTROL_BASE_URL:http://temporal-demo-worker-control:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
integration.task-queue=${INTEGRATION_TASK_QUEUE:integration-v1}
integration.cursor-secret=${INTEGRATION_CURSOR_SECRET:}

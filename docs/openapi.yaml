openapi: 3.1.0
info:
  title: Workflow Jobs API
  version: 1.0.0
  description: >-
    A caller-scoped API for named HTTP tasks. Production requires a JWT with the
    configured issuer and audience. Read operations need workflow.read; submit
    and cancel need workflow.write. Task URLs and credentials are server settings.
security:
  - bearerAuth: []
paths:
  /api/v1/jobs:
    post:
      operationId: startJob
      summary: Start one saved job
      description: >-
        Supply a business jobId that is unique for this caller. A repeated retained
        jobId returns 409. On an uncertain response, read the same ID before retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartJob'
      responses:
        '202':
          description: Job accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [jobId, runId, workflowId]
                properties:
                  jobId: {type: string}
                  runId: {type: string}
                  workflowId: {type: string}
        '400': {description: Invalid input or unknown task}
        '401': {description: Missing or invalid JWT}
        '403': {description: Required scope is absent}
        '409': {description: This caller already used the job ID}
        '503': {description: Temporal request could not finish; read the same ID before retrying}
  /api/v1/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: readJob
      summary: Read this caller's job without requiring a live worker
      responses:
        '200':
          description: Temporal state and any finished business result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobView'
        '401': {description: Missing or invalid JWT}
        '403': {description: Required scope is absent}
        '404': {description: No job for this caller and ID}
        '503': {description: Temporal is unavailable}
  /api/v1/jobs/{jobId}/events:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: readJobEvents
      summary: Read one page of recorded events
      description: >-
        Events omit activity inputs and outputs. Follow nextPageToken with the
        returned runId. Tokens expire after 15 minutes and are bound to caller/job/run.
      parameters:
        - in: query
          name: pageSize
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: pageToken
          schema: {type: string, maxLength: 16384}
        - in: query
          name: runId
          schema: {type: string}
          description: Required when pageToken is supplied
      responses:
        '200':
          description: A page of server events
          content:
            application/json:
              schema:
                type: object
                required: [runId, events]
                properties:
                  runId: {type: string}
                  nextPageToken: {type: [string, 'null']}
                  events:
                    type: array
                    items:
                      type: object
                      required: [id, time, type]
                      properties:
                        id: {type: integer, format: int64}
                        time: {type: string, format: date-time}
                        type: {type: string}
        '400': {description: Invalid, expired, or mismatched paging token}
        '401': {description: Missing or invalid JWT}
        '403': {description: Required scope is absent}
        '404': {description: No job for this caller and ID}
        '503': {description: Temporal is unavailable}
  /api/v1/jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/jobId'
    post:
      operationId: cancelJob
      summary: Request cancellation and configured undo work
      description: >-
        Acceptance does not mean external work stopped. Poll the business result.
        This endpoint signals the workflow; it never force-terminates it.
      responses:
        '202':
          description: Cancellation requested, or the job was already closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  jobId: {type: string}
        '401': {description: Missing or invalid JWT}
        '403': {description: Required scope is absent}
        '404': {description: No job for this caller and ID}
        '503': {description: Temporal is unavailable}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    jobId:
      in: path
      name: jobId
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,80}$'}
  schemas:
    StartJob:
      type: object
      required: [jobId, steps]
      description: Entire request must fit in 16 KiB; send references for large data
      properties:
        jobId: {type: string, pattern: '^[A-Za-z0-9_-]{1,80}$'}
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [task]
            properties:
              task:
                type: string
                description: A task already registered by the server operator
              waitSeconds: {type: integer, minimum: 0, maximum: 86400, default: 0}
              input:
                type: object
                maxProperties: 32
                propertyNames: {minLength: 1, maxLength: 64}
                additionalProperties: {type: string, maxLength: 2048}
    JobView:
      type: object
      required: [jobId, runId, executionStatus, pendingTasks]
      properties:
        jobId: {type: string}
        runId: {type: string}
        executionStatus:
          type: string
          description: Temporal execution status, independent from the business result
        businessStatus:
          type: [string, 'null']
          description: COMPLETED, FAILED, CANCELED, or NEEDS_ATTENTION when a result is available
        result:
          type: [object, 'null']
          description: >-
            JobSnapshot includes status, currentStep, per-step state, receipts,
            bounded adapter output, and a short error. It is available after a
            handled workflow finishes; it is not a live worker query.
        pendingTasks:
          type: array
          items:
            type: object
            properties:
              activityId: {type: string}
              activityType: {type: string}
              state: {type: string}
              attempt: {type: integer}
              worker: {type: string}
